# Render Blueprint: creates the web service + a free Postgres database.
# If deploying from the dcn-demo repo, rootDir points Render at this folder.
services:
  - type: web
    name: strike-tracker
    runtime: python
    plan: free
    rootDir: strike-tracker
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: strike-tracker-db
          property: connectionString
      - key: ADMIN_KEY
        sync: false  # optional: set in the dashboard to lock adding/removing names

databases:
  - name: strike-tracker-db
    plan: free
