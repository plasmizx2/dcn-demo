# Render Blueprint (free plan). Render only reads blueprints from the repo
# root, so move this file there if you deploy with "New → Blueprint".
services:
  - type: web
    name: strike-tracker
    runtime: python
    plan: free
    rootDir: strike-tracker
    buildCommand: pip install -r requirements.txt
    # Exactly one worker: the Discord backup runs in a background thread.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60
    envVars:
      - key: DISCORD_WEBHOOK_URL   # storage/backup + announcements
        sync: false
      - key: DISCORD_PUBLIC_KEY    # optional: /strikes buttons in Discord
        sync: false
      - key: DISCORD_BOT_TOKEN     # optional: registers the /strikes command
        sync: false
      - key: ADMIN_KEY             # optional: lock adding/removing names
        sync: false
