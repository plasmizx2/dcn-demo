<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strike Leaderboard</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e3e3de; --red:#c9372c; --green:#2f7d4a; --bar:#f1d6d3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#21211f; --text:#eeeeea; --muted:#9a9a93; --line:#34342f; --red:#ef6a5e; --green:#5cbf7f; --bar:#4a2724; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  nav { display:flex; gap:16px; margin-bottom:16px; font-size:15px; }
  nav a { color:var(--muted); text-decoration:none; }
  nav a.on { color:var(--text); font-weight:700; }
  h1 { margin:0 0 4px; font-size:28px; }
  h2 { font-size:16px; margin:0 0 10px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:560px) { .split { grid-template-columns:1fr; } }
  .mini > div > div { display:flex; justify-content:space-between; gap:8px; padding:4px 0; }
  .mini span:first-child { overflow-wrap:anywhere; }
  .most h2 { color:var(--red); }
  .least h2 { color:var(--green); }
  .row { display:grid; grid-template-columns:2.5em 1fr auto; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .rank { color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; }
  .who { position:relative; overflow:hidden; border-radius:6px; padding:4px 8px; overflow-wrap:anywhere; }
  .who .fill { position:absolute; inset:0 auto 0 0; background:var(--bar); z-index:0; }
  .who span { position:relative; z-index:1; font-weight:600; }
  .n { font-weight:700; font-variant-numeric:tabular-nums; min-width:2ch; text-align:right; }
  .n.zero { color:var(--green); }
</style>
</head>
<body>
<main>
  <nav><a href="/">Give strikes</a><a href="/leaderboard" class="on">Leaderboard</a></nav>
  <h1>Leaderboard</h1>
  <p class="sub" id="summary">Loading…</p>

  <div class="split">
    <div class="card mini most"><h2>Most strikes</h2><div id="most"></div></div>
    <div class="card mini least"><h2>Fewest strikes</h2><div id="least"></div></div>
  </div>

  <div class="card"><h2>Full ranking</h2><div id="all"></div></div>
</main>

<script>
const $ = id => document.getElementById(id);
function el(tag, props = {}, text) {
  const e = Object.assign(document.createElement(tag), props);
  if (text !== undefined) e.textContent = text;
  return e;
}

function mini(target, list) {
  target.replaceChildren();
  if (!list.length) target.append(el("div", { className: "sub" }, "No one yet."));
  for (const p of list) {
    const d = el("div");
    d.append(el("span", {}, p.name), el("b", {}, p.strikes));
    target.append(d);
  }
}

async function load() {
  let data;
  try { data = await (await fetch("/api/people")).json(); }
  catch (e) { $("summary").textContent = "Can't reach the server (it may be waking up)…"; return; }

  const people = [...data.people].sort((a, b) => b.strikes - a.strikes || a.name.localeCompare(b.name));
  const total = people.reduce((s, p) => s + p.strikes, 0);
  const clean = people.filter(p => p.strikes === 0).length;
  $("summary").textContent = `${people.length} people · ${total} total strikes · ${clean} with a clean record`;

  mini($("most"), people.filter(p => p.strikes > 0).slice(0, 5));
  mini($("least"), [...people].reverse().slice(0, 5));

  // Standard competition ranking: ties share a rank (1, 2, 2, 4).
  const max = people[0]?.strikes || 1;
  const all = $("all");
  all.replaceChildren();
  let rank = 0;
  people.forEach((p, i) => {
    if (i === 0 || p.strikes !== people[i - 1].strikes) rank = i + 1;
    const who = el("div", { className: "who" });
    const fill = el("div", { className: "fill" });
    fill.style.width = `${(p.strikes / max) * 100}%`;
    who.append(fill, el("span", {}, p.name));
    const row = el("div", { className: "row" });
    row.append(el("div", { className: "rank" }, `#${rank}`), who, el("div", { className: "n" + (p.strikes ? "" : " zero") }, p.strikes));
    all.append(row);
  });
  if (!people.length) all.append(el("p", { className: "sub" }, "No names yet."));
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
