<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strike Tracker</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e3e3de; --red:#c9372c; --green:#2f7d4a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#21211f; --text:#eeeeea; --muted:#9a9a93; --line:#34342f; --red:#ef6a5e; --green:#5cbf7f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  nav { display:flex; gap:16px; margin-bottom:16px; font-size:15px; }
  nav a { color:var(--muted); text-decoration:none; }
  nav a.on { color:var(--text); font-weight:700; }
  h1 { margin:0 0 4px; font-size:28px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  input, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { min-height:90px; resize:vertical; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:8px 12px; cursor:pointer; }
  button:hover { border-color:var(--muted); }
  button.primary { background:var(--text); color:var(--bg); border-color:var(--text); }
  .row { display:flex; gap:8px; align-items:center; }
  .person { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .person:first-child { border-top:0; }
  .name { flex:1; font-weight:600; overflow-wrap:anywhere; }
  .marks { color:var(--red); letter-spacing:2px; font-size:14px; }
  .count { min-width:2ch; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; }
  .count.zero { color:var(--muted); font-weight:400; }
  .btn-add { color:var(--red); font-weight:700; width:40px; }
  .btn-sub { color:var(--green); font-weight:700; width:40px; }
  .del { border:0; color:var(--muted); padding:4px 6px; }
  .log div { padding:4px 0; color:var(--muted); font-size:14px; }
  .log b { color:var(--text); }
  details summary { cursor:pointer; font-weight:600; }
  .hidden { display:none; }
  #msg { color:var(--red); min-height:1.4em; font-size:14px; }
</style>
</head>
<body>
<main>
  <nav><a href="/" class="on">Give strikes</a><a href="/leaderboard">Leaderboard</a></nav>
  <h1>Strike Tracker</h1>
  <p class="sub">Tap <b>+</b> to give someone a strike, <b>−</b> to take one away.</p>

  <div class="card">
    <input id="search" placeholder="Search names…" autocomplete="off">
    <div style="margin-top:8px"><input id="reason" placeholder="Reason (optional, shows in activity log)" maxlength="200"></div>
    <div id="msg"></div>
    <div id="list"></div>
  </div>

  <div class="card">
    <details>
      <summary>Add names</summary>
      <p class="sub" style="margin:8px 0">Paste names, one per line or comma-separated. Duplicates are skipped.</p>
      <textarea id="names" placeholder="Alice&#10;Bob&#10;Charlie"></textarea>
      <div id="keyRow" class="hidden" style="margin-top:8px"><input id="adminKey" type="password" placeholder="Admin key"></div>
      <div class="row" style="margin-top:8px"><button class="primary" id="addBtn">Add names</button><span id="addMsg" class="sub" style="margin:0"></span></div>
    </details>
  </div>

  <div class="card log">
    <details open>
      <summary>Recent activity</summary>
      <div id="log"></div>
    </details>
  </div>
  <p class="sub" id="backup" style="font-size:13px"></p>
</main>

<script>
let state = { people: [], log: [], admin_required: false };
const $ = id => document.getElementById(id);
try { $("adminKey").value = localStorage.getItem("adminKey") || ""; } catch (e) {}

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  const key = $("adminKey").value;
  if (key) headers["X-Admin-Key"] = key;
  const res = await fetch(path, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function el(tag, props = {}, text) {
  const e = Object.assign(document.createElement(tag), props);
  if (text !== undefined) e.textContent = text;
  return e;
}

function render() {
  $("keyRow").classList.toggle("hidden", !state.admin_required);
  const q = $("search").value.trim().toLowerCase();
  const list = $("list");
  list.replaceChildren();
  const people = state.people.filter(p => p.name.toLowerCase().includes(q));
  if (!people.length) list.append(el("p", { className: "sub" }, state.people.length ? "No matches." : "No names yet — add some below."));
  for (const p0 of people) {
    // Show queued-but-unsent clicks immediately.
    const pending = outbox.filter(o => o.id === p0.id).reduce((s, o) => s + o.delta, 0);
    const p = { ...p0, strikes: Math.max(0, p0.strikes + pending) };
    const row = el("div", { className: "person" });
    const name = el("div", { className: "name" }, p.name);
    if (p.strikes) name.append(el("div", { className: "marks" }, "✕".repeat(Math.min(p.strikes, 20))));
    const sub = el("button", { className: "btn-sub", title: "Remove a strike", disabled: p.strikes === 0 }, "−");
    sub.onclick = () => strike(p.id, -1);
    const add = el("button", { className: "btn-add", title: "Add a strike" }, "+");
    add.onclick = () => strike(p.id, 1);
    const del = el("button", { className: "del", title: "Remove person" }, "🗑");
    del.onclick = () => removePerson(p);
    const count = el("span", { className: "count" + (p.strikes ? "" : " zero"), title: pending ? "Sending…" : "" }, p.strikes + (pending ? "*" : ""));
    row.append(name, sub, count, add, del);
    list.append(row);
  }
  const b = state.backup;
  $("backup").textContent = !b ? "⚠ No Discord backup configured: data will be lost when the server restarts."
    : b.error ? `⚠ Discord backup failing (retrying): ${b.error}`
    : "✓ Backed up to Discord";
  const log = $("log");
  log.replaceChildren();
  if (!state.log.length) log.append(el("div", {}, "Nothing yet."));
  for (const l of state.log) {
    const d = el("div");
    d.append(el("b", {}, l.name), ` ${l.delta > 0 ? "got a strike" : "lost a strike"}`);
    if (l.reason) d.append(` — ${l.reason}`);
    d.append(el("span", {}, `  · ${new Date(l.at.replace(" ", "T") + (l.at.includes("+") ? "" : "Z")).toLocaleString()}`));
    log.append(d);
  }
}

async function load() {
  try { state = await api("/api/people"); render(); }
  catch (e) { if (!outbox.length) $("msg").textContent = "Can't reach the server (it may be waking up)…"; }
}

// Outbox: clicks are saved in the browser first and resent until the server
// confirms them, so nothing is lost while Render is waking up. Each click has
// a unique op_id, so a resend is never counted twice.
let outbox = [];
try { outbox = JSON.parse(localStorage.getItem("outbox") || "[]"); } catch (e) {}
const saveOutbox = () => { try { localStorage.setItem("outbox", JSON.stringify(outbox)); } catch (e) {} };
let flushing = false, retryDelay = 2000;

function strike(id, delta) {
  const opId = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random());
  outbox.push({ op_id: opId, id, delta, reason: $("reason").value });
  $("reason").value = "";
  saveOutbox();
  render();
  flush();
}

async function flush() {
  if (flushing) return;
  flushing = true;
  while (outbox.length) {
    const op = outbox[0];
    try {
      await api(`/api/people/${op.id}/strike`, { method: "POST", body: JSON.stringify(op) });
      outbox.shift();
      saveOutbox();
      retryDelay = 2000;
    } catch (e) {
      // Server asleep/starting up or offline: keep the click, try again with backoff.
      $("msg").textContent = `Server waking up… ${outbox.length} change(s) saved and will send automatically.`;
      flushing = false;
      setTimeout(flush, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 30000);
      return;
    }
  }
  flushing = false;
  $("msg").textContent = "";
  load();
}
window.addEventListener("online", flush);

async function removePerson(p) {
  if (!confirm(`Remove ${p.name} from the list?`)) return;
  try { await api(`/api/people/${p.id}`, { method: "DELETE" }); } catch (e) { $("msg").textContent = e.message; }
  load();
}

$("addBtn").onclick = async () => {
  try {
    try { localStorage.setItem("adminKey", $("adminKey").value); } catch (e) {}
    const r = await api("/api/people", { method: "POST", body: JSON.stringify({ names: $("names").value }) });
    $("addMsg").textContent = `Added ${r.added}.`;
    $("names").value = "";
  } catch (e) { $("addMsg").textContent = e.message; }
  load();
};
$("search").oninput = render;

load();
flush(); // send anything left over from a previous visit
setInterval(load, 5000); // keep in sync with other people's clicks
</script>
</body>
</html>
